version: "3.8"

services:
  # ============================
  # MQTT Broker (Mosquitto)
  # ============================
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "0.0.0.0:1883:1883"  # ✅ Expose to all interfaces
      - "0.0.0.0:9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "test", "-C", "1", "-i", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - edge_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Sensor Simulator
  # ============================
  sensor-simulator:
    build:
      context: .
    image: local/sensor-simulator:latest
    container_name: sensor-simulator
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_TOPIC=ev/metrics
      - PUBLISH_INTERVAL=2
    # depends_on:
    #   mqtt-broker:
        # condition: service_healthy
    restart: unless-stopped
    networks:
      - edge_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # ML Inference (Anomaly Detection)
  # ============================
  ml-inference:
    image: tensorflow/tensorflow:2.14.0
    container_name: ml-inference
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_INPUT_TOPIC=ev/metrics
      - MQTT_OUTPUT_TOPIC=ev/alerts
    # depends_on:
    #   mqtt-broker:
        # condition: service_healthy
    restart: unless-stopped
    networks:
      - edge_net
    command:  bash -c "pip install scikit-learn joblib numpy paho-mqtt && python /app/models/Machine_learning_enhanced.py"
    volumes:
      - ./edge/models:/app/models:rw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge_net:
    driver: bridge