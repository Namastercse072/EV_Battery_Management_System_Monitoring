# version: "3.9"

services:
  # ============================
  # 1️⃣ Edge Gateway (MiNiFi)
  # ============================
  minifi:
    image: apache/nifi-minifi:latest
    container_name: minifi
    # bind the whole config directory (more cross-platform reliable than a single file mount)
    environment:
      - NIFI_WEB_HTTP_PORT=8443
      - MiNiFi_home=/opt/minifi/minifi-2.6.0
    volumes:
      - ./minifi:/opt/minifi/minifi-2.6.0/conf
    # depends_on:
      # - nifi
    restart: unless-stopped

  # ============================
  # 2️⃣ Dataflow Orchestrator (NiFi)
  # ============================
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTP_PORT=8443
      - NIFI_HOME=/opt/nifi/nifi-current
    # Use a mix: bind-mount conf for easy edits, named volumes for runtime data
    volumes:
      - ./nifi:/opt/nifi/nifi-current/conf
    restart: unless-stopped 

  # ============================
  # 3️⃣ Stream Broker (Kafka - KRaft mode)
  # ============================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    volumes:
      - ./kafka-data:/apache/kafka
    restart: unless-stopped

  # ============================
  # 4️⃣ Compute Engine (Spark)
  # ============================
  spark:
    image: bitnami/spark:3.5
    container_name: spark
    environment:
      - SPARK_MODE=master
    ports:  
      - "8081:8080"
    volumes:
      - ./spark:/opt/spark-apps
    command: >
      bash -c "spark-submit --master local[*]
      /opt/spark-apps/spark-app.py"
    depends_on:
      - kafka
    restart: unless-stopped

  # ============================
  # 5️⃣ Metadata Catalog (Atlas)
  # ============================
  atlas:
    image: sburn/apache-atlas:2.2.0
    container_name: atlas
    ports:
      - "21000:21000"
    depends_on:
      - kafka
      # - spark
    environment:
      - ATLAS_OPTS=-Datlas.graph.storage.hostname=localhost
    restart: unless-stopped

  # ============================
  # 6️⃣ Visualization (Superset)
  # ============================
  superset:
    image: apache/superset:3.0.0
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=CalceBeatEdgeViz
      - SUPERSET_LOAD_EXAMPLES=no
    volumes:
      - ./superset:/app/superset_home
    # depends_on:
    #   - spark
    restart: unless-stopped
