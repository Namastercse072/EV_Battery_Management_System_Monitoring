version: "3.8"

services:
  # ============================
  # EDGE SERVICES (Eage)
  # ============================
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./Eage/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "test", "-C", "1", "-i", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - unified_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sensor-simulator:
    build:
      context: ./Eage
      dockerfile: Dockerfile
    image: local/sensor-simulator:latest
    container_name: sensor-simulator
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_TOPIC=ev/metrics
      - PUBLISH_INTERVAL=2
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unified_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ml-inference:
    build:
      context: ./Eage/edge
      dockerfile: Dockerfile.ml
    image: local/ml-inference:latest
    container_name: ml-inference
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_INPUT_TOPIC=ev/metrics
      - MQTT_OUTPUT_TOPIC=ev/alerts
      - MODEL_PATH=/app/models/isoforest.pkl
      - CONTAMINATION=0.1
      - ANOMALY_THRESHOLD=-0.5
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unified_net
    volumes:
      - ./Eage/edge/models:/app/models:rw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # CLOUD SERVICES
  # ============================
  kafka:
    build:
      context: ./Cloud/kafka
    image: local/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CLUSTER_ID=xB7zK9pL5mN2qR8vT4wX9Y
    volumes:
      - ./Cloud/kafka/server.properties:/opt/kafka/config/kraft/server.properties:ro
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - unified_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mqtt-kafka-bridge:
    build:
      context: ./Cloud/bridge
    image: local/mqtt-kafka-bridge:latest
    container_name: mqtt-kafka-bridge
    environment:
      # ✅ Now on unified network - can reach mqtt-broker
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_TOPICS=ev/metrics,ev/alerts
      - KAFKA_BROKER=kafka:9092
      - TOPIC_MAP={"ev/metrics":"ev_raw","ev/alerts":"ev_alerts_processed"}
      - MQTT_QOS=1
      - BATCH_SIZE=10
      - BATCH_TIMEOUT=5
    depends_on:
      kafka:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unified_net
    volumes:
      - ./Cloud/bridge/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=superset_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Cloud/postgres_data/01-init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - unified_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - unified_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    ports:
      - "8080:8080"
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-logs:/opt/nifi/nifi-current/logs
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8080/nifi-api/system-diagnostics"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - unified_net
    depends_on:
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  superset:
    build:
      context: ./Cloud/superset
      dockerfile: Dockerfile
    image: local/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=mysecret
      - DATABASE_HOST=postgres
      - REDIS_HOST=redis
      - SQLALCHEMY_DATABASE_URI=postgresql://superset:superset_pass@postgres:5432/superset_db
    volumes:
      - superset-config:/home/superset/.superset
      - superset-logs:/var/log/superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unified_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  spark-master:
    build:
      context: ./Cloud/spark-apps
    image: local/spark:4.0.0
    container_name: spark-master
    ports:
      - "8888:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
    volumes:
      - ./Cloud/spark-apps:/opt/spark-apps
      - spark-data:/opt/spark-data
    restart: unless-stopped
    networks:
      - unified_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================
# Volumes
# ============================
volumes:
  mqtt-data:
  mqtt-logs:
  kafka-data:
  postgres-data:
  redis-data:
  nifi-conf:
  nifi-logs:
  superset-config:
  superset-logs:
  spark-data:

# ============================
# Networks (UNIFIED)
# ============================
networks:
  unified_net:
    name: unified_network
    driver: bridge
