# KRaft Mode
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@kafka:9093

# Listeners
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://kafka:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
kafka.listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT  
# Storage
log.dirs=/var/lib/kafka/data

# Auto-create topics
auto.create.topics.enable=true
auto.create.topics.num.partitions=1
auto.create.topics.replication.factor=1
# Topic defaults
auto.topic.creation.enable=true
num.partitions=1    
auto.create.groups.enable=true
default.replication.factor=1
min.insync.replicas=1

# Performance tuning
num.network.threads=8
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
