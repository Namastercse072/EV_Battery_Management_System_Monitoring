# NiFi Web Server Configuration
nifi.web.http.host=0.0.0.0
nifi.web.http.port=8080
nifi.web.https.port=8443
nifi.web.https.enable=false

# NiFi Cluster Configuration
nifi.cluster.is.node=false
nifi.cluster.node.protocol.port=8082

# Repository Directories
nifi.flowfile.repository.directory=./flowfile_repository
nifi.database.repository.directory=./database_repository
nifi.content.repository.directory=./content_repository
nifi.provenance.repository.directory=./provenance_repository

# State Management
nifi.state.management.configuration.file=./conf/state-management.xml
nifi.state.management.provider.local=org.apache.nifi.state.manager.StandardStateManagerProvider
nifi.state.management.provider.cluster=org.apache.nifi.state.manager.StandardStateManagerProvider

# Core Properties
nifi.core.nar.library.directory=./lib
nifi.nar.library.directory=./lib
nifi.nar.working.directory=./work/nar/
nifi.documentation.working.directory=./work/docs/components

# Security
nifi.security.needClientAuth=
nifi.security.user.authorizer=file-provider
nifi.security.user.login.identity.provider=

# Flow File Repository
nifi.flowfile.repository.always.sync=false
nifi.flowfile.repository.checkpoint.interval=2 min

# Content Repository
nifi.content.claim.max.appendable.size=10 MB
nifi.content.claim.max.flow.files=100
nifi.content.repository.archive.enabled=true
nifi.content.repository.archive.max.retention.period=12 hours
nifi.content.repository.archive.max.usage.percentage=50%
nifi.content.repository.always.sync=false

# Sensitive Property Key
nifi.sensitive.props.key=
nifi.sensitive.props.algorithm=PBEWITHMD5AND256BITAES-CBC-OPENSSL
nifi.sensitive.props.additional.keys=

# Provenance Repository
nifi.provenance.repository.implementation=org.apache.nifi.provenance.PersistentProvenanceRepository
nifi.provenance.repository.directory=./provenance_repository
nifi.provenance.repository.max.storage.time=24 hours
nifi.provenance.repository.max.storage.size=1 GB
nifi.provenance.repository.rollover.time=30 secs
nifi.provenance.repository.rollover.size=100 MB
nifi.provenance.repository.query.threads=2
nifi.provenance.repository.compress.on.rollover=true
nifi.provenance.repository.always.sync=false
nifi.provenance.repository.buffer.size=100000