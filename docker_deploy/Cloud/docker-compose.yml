version: '3.8'
services:
  nifi:
    image: apache/nifi:1.25.0
    ports:
      - "8080:8080" 
    volumes:
      - ./cloud/nifi/conf:/opt/nifi/nifi-current/conf

  kafka:
    image: bitnami/kafka:3.6.1 #bitnami/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
    depends_on:
      - zookeeper

  zookeeper:
    image: bitnami/zookeeper:3.8
    ports:
      - "2181:2181"

  spark:
    image: bitnami/spark:3.5.1
    volumes:
      - ./cloud/spark:/opt/spark-apps
    command: >
      bash -c "spark-submit --master local[*]
      /opt/spark-apps/spark_app.py"

  superset:
    image: apache/superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_LOAD_EXAMPLES=yes
    depends_on:
      - spark
