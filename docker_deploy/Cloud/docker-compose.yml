version: "3.8"

services:
  # ============================
  # 1. Message Broker (Kafka)
  # ============================
  kafka:
    build:
      context: ./kafka
    image: local/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CLUSTER_ID=xB7zK9pL5mN2qR8vT4wX9Y
    volumes:
      - ./kafka/server.properties:/opt/kafka/config/kraft/server.properties:ro
      - ./kafka/data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # MQTT to Kafka Bridge
  # ============================
  mqtt-kafka-bridge:
    build:
      context: ./bridge
    image: local/mqtt-kafka-bridge:latest
    container_name: mqtt-kafka-bridge
    ports:
      - "1884:1883"
      - "9002:9001"
    environment:
      - MQTT_HOST=${EDGE_HOST}
      - MQTT_PORT=1883
      - MQTT_TOPICS=ev/metrics,ev/alerts
      
      # Kafka Configuration
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPICS=ev_raw,ev_alerts_processed
      
      # Topic Mapping
      - TOPIC_MAP={"ev/metrics":"ev_raw"}
      
      # Settings
      - MQTT_QOS=1
      - BATCH_SIZE=10
      - BATCH_TIMEOUT=5
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cloud_net
    volumes:
      - ./bridge/logs:/app/logs
      - ./bridge/mqtt_to_kafka.py:/app/mqtt_to_kafka.py:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 2. NiFi (Data Flow)
  # ============================
  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    ports:
      - "8080:8080"
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-logs:/opt/nifi/nifi-current/logs
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8080/nifi-api/system-diagnostics"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - cloud_net
    depends_on:
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 3. PostgreSQL (Data Warehouse)
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=superset_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres_data/01-init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql
      - ./postgres_data/02-init-tables.sh:/docker-entrypoint-initdb.d/02-init-tables.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 4. Redis (Cache)
  # ============================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 5. Superset (Visualization)
  # ============================
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: local/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=mysecret
      - SUPERSET_LOAD_EXAMPLES=no
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=superset_pass
      - DATABASE_DB=superset_db
      - DATABASE_PORT=5432
      - DATABASE_DIALECT=postgresql
      - DATABASE_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_CONFIG={"CACHE_TYPE":"RedisCache","CACHE_DEFAULT_TIMEOUT":300,"CACHE_KEY_PREFIX":"superset_","CACHE_REDIS_URL":"redis://redis:6379/0"}
      - DATA_CACHE_CONFIG={"CACHE_TYPE":"RedisCache","CACHE_DEFAULT_TIMEOUT":300,"CACHE_KEY_PREFIX":"data_","CACHE_REDIS_URL":"redis://redis:6379/1"}
      - SQLALCHEMY_DATABASE_URI=postgresql://superset:superset_pass@postgres:5432/superset_db
    volumes:
      - superset-config:/home/superset/.superset
      - superset-logs:/var/log/superset
      - ./superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -c "
       superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.local --password admin 2>/dev/null || true && gunicorn -w 2 -b 0.0.0.0:8088 --timeout 120 'superset.app:create_app()'"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 6. Spark Master
  # ============================
  spark-master:
    build:
      context: ./spark-apps
    image: local/spark:4.0.0
    container_name: spark-master
    command: >
      spark-submit
      --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0
      /opt/spark-apps/battery_processor.py
    ports:
      - "8888:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark-apps:/opt/spark-apps
      - spark-data:/opt/spark-data
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Named Volumes
  # ============================
volumes:
  kafka-data:
  postgres-data:
  redis-data:
  nifi-conf:
  nifi-logs:
  superset-data:
  spark-data:
  superset-config:
  superset-logs:
  spark-logs:
  superset-home:

# ============================
# Network
# ============================
networks:
  cloud_net:
    # name: cloud_default
    driver: bridge