version: "3.8"

services:
  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi 
    ports:
      - "8080:8080"
    volumes:
      - ./nifi_conf:/opt/nifi/nifi-current/conf
    networks:
      - cloud_net
    restart: unless-stopped

  kafka:
    build:
      context: ./kafka
    image: local/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CLUSTER_ID=xB7zK9pL5mN2qR8vT4wX9Y
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_NUM_PARTITIONS=1
    volumes:
      - ./kafka/server.properties:/opt/kafka/config/kraft/server.properties:ro
      - ./kafka/data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s 
      retries: 5
      start_period: 30s
    depends_on: []
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  spark:
    build:
      context: ./spark-apps
    image: local/spark:3.5.1
    container_name: spark
    environment:
      - SPARK_MODE=master
    ports:
      - "8081:8080"
    volumes:
      - ./spark-apps:/opt/spark-apps
    depends_on:
      kafka:
        condition: service_healthy  
    command: >
      bash -c "spark-submit --master local[*] --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 /opt/spark-apps/spark_app.py"
    restart: on-failure
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_LOAD_EXAMPLES=yes
      - SUPERSET_SECRET_KEY=mysecret
    networks:
      - cloud_net
    restart: unless-stopped

networks:
  cloud_net:
    driver: bridge