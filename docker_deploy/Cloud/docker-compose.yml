version: "3.8"

services:
  # ============================
  # 1. Message Broker (Kafka)
  # ============================
  kafka:
    build:
      context: ./kafka
    image: local/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CLUSTER_ID=xB7zK9pL5mN2qR8vT4wX9Y
    volumes:
      - ./kafka/server.properties:/opt/kafka/config/kraft/server.properties:ro
      - ./kafka/data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 2. Data Flow Orchestrator (NiFi)
  # ============================
  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    ports:
      - "8080:8080"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_WEB_HTTPS_ENABLE=false
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-logs:/opt/nifi/nifi-current/logs
      - nifi-flowfile-repo:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content-repo:/opt/nifi/nifi-current/content_repository
      - nifi-provenance-repo:/opt/nifi/nifi-current/database_repository
      - nifi-state:/opt/nifi/nifi-current/state
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloud_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nifi-api/system-diagnostics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 3. Stream Processing (Spark)
  # ============================
  spark:
    build:
      context: ./spark-apps
    image: local/spark:3.5.1
    container_name: spark
    ports:
      - "4040:4040"
      - "8081:8081"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark-apps:/opt/spark-apps
      - spark-logs:/opt/spark/logs
    depends_on:
      kafka:
        condition: service_healthy
    # for testing only
    command: >
      spark-submit
      --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0
      /opt/spark-apps/battery_processor.py
    restart: on-failure
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 4. Database (PostgreSQL for Superset)
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=superset_pass
      - POSTGRES_DB=superset_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres_data/01-init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql
      - ./postgres_data/02-init-tables.sh:/docker-entrypoint-initdb.d/02-init-tables.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 5. Data Visualization (Superset)
  # ============================
  superset:
    build:
      context: .
      dockerfile: ./superset/Dockerfile
    image: local/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_LOAD_EXAMPLES=yes
      - SUPERSET_SECRET_KEY=mysecret
      - DATABASE_DB=superset_db
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=superset_pass
      - DATABASE_DIALECT=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_CONFIG={"CACHE_TYPE":"RedisCache","CACHE_DEFAULT_TIMEOUT":300,"CACHE_KEY_PREFIX":"superset_","CACHE_REDIS_URL":"redis://redis:6379/0"}
      - DATA_CACHE_CONFIG={"CACHE_TYPE":"RedisCache","CACHE_DEFAULT_TIMEOUT":300,"CACHE_KEY_PREFIX":"data_","CACHE_REDIS_URL":"redis://redis:6379/1"}
      # - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset_pass@postgres:5432/superset_db
    volumes:
      - superset-config:/home/superset/.superset
      - superset-logs:/var/log/superset
      - ./superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -c "
      superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.local --password admin 2>/dev/null || true && gunicorn -w 2 -b 0.0.0.0:8088 --timeout 120 'superset.app:create_app()'"
    restart: on-failure
    networks:
      - cloud_net
    healthcheck:  
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # 6. Redis Cache (for Superset)
  # ============================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================
# Named Volumes for Persistence
# ============================
volumes:
  kafka-data:
  nifi-conf:                   
  nifi-logs:                         
  nifi-flowfile-repo:
  nifi-content-repo:
  nifi-provenance-repo:
  nifi-state:
  postgres-data:
  redis-data:
  superset-config:
  superset-logs:
  spark-logs:

# ============================
# Network
# ============================
networks:
  cloud_net:
    driver: bridge