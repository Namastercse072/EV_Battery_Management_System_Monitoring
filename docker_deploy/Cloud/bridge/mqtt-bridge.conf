# Mosquitto Bridge Configuration

# Main MQTT listener
listener 1883
protocol mqtt
allow_anonymous true

# Websocket listener
listener 9001
protocol websockets
allow_anonymous true

# ============================
# Bridge to Eage MQTT Broker
# ============================
connection eage-to-cloud
address mqtt-broker:1883
remote_clientid bridge-eage-cloud
local_clientid cloud-bridge
keepalive_interval 60
reconnect_delay 5
reconnect_delay_max 30

# Topics to forward (bidirectional)
topic ev/metrics in 0
topic ev/alerts in 0
topic ev/# out 0

# Connection security (optional)
#username eage_user
#password eage_pass

# Start bridge on startup
start_type automatic